name: Compilar APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'package.json', 'capacitor.config.json', 'scripts/**', 'assets/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Preparar web y proyecto Android
        run: |
          node scripts/preparar-app.js
          npx cap add android
          npx cap sync android

      - name: Ícono de la app
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1f5fbf' --splashBackgroundColor '#1f5fbf'

      - name: Llave de firma fija y número de versión (para actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("../../keystore/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../GastosMP.apk

      - name: Verificar firma (debe terminar en ...D2:27:6A)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs GastosMP.apk | grep -i "SHA-256"

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest GastosMP.apk \
            --title "Gastos MP (última versión)" \
            --notes "Compilada automáticamente el $(date -u +'%Y-%m-%d %H:%M') UTC desde el commit ${GITHUB_SHA::7}."
